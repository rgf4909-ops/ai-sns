<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void — 아무도 없는 SNS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
  :root {
    --bg:#000; --bg2:#0d0d0d; --bg3:#161616;
    --border:#2f3336; --text:#e7e9ea; --text2:#71767b; --text3:#536471;
    --accent:#1d9bf0; --accent-hover:#1a8cd8; --like:#f91880; --rt:#00ba7c;
    --font:'Noto Sans KR',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh;max-width:600px;margin:0 auto;border-right:1px solid var(--border);border-left:1px solid var(--border);}

  /* NAV */
  nav{position:sticky;top:0;z-index:100;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:53px;}
  .logo{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-0.5px;}
  .logo span{color:var(--accent);}
  .nav-tabs{display:flex;flex:1;justify-content:center;gap:0;}
  .nav-tab{background:none;border:none;color:var(--text2);padding:0 32px;height:53px;cursor:pointer;font-size:15px;font-weight:500;border-bottom:2px solid transparent;transition:all 0.15s;font-family:var(--font);}
  .nav-tab:hover{background:rgba(255,255,255,0.03);}
  .nav-tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:700;}
  .avatar-sm{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;overflow:hidden;flex-shrink:0;color:white;}

  /* PAGES */
  .page{display:none;}
  .page.active{display:block;}
  .feed{padding-bottom:80px;}

  /* COMPOSER */
  .composer{border-bottom:1px solid var(--border);padding:12px 16px;display:flex;gap:12px;}
  .composer-body{flex:1;}
  .composer-divider{height:1px;background:var(--border);margin:8px 0;}
  .composer textarea{width:100%;background:none;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:19px;resize:none;min-height:56px;font-weight:400;}
  .composer textarea::placeholder{color:var(--text3);}
  .composer-actions{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}
  .composer-tools{display:flex;gap:4px;}
  .composer-tools button,.attach-label{background:none;border:none;color:var(--accent);cursor:pointer;font-size:18px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background 0.15s;}
  .composer-tools button:hover,.attach-label:hover{background:rgba(29,155,240,0.1);}
  .post-btn{background:var(--accent);color:white;border:none;border-radius:9999px;padding:0 18px;height:36px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);transition:background 0.15s;}
  .post-btn:hover{background:var(--accent-hover);}
  .img-preview-wrap{margin-top:10px;position:relative;display:inline-block;width:100%;}
  .img-preview-wrap img{max-width:100%;max-height:280px;border-radius:16px;border:1px solid var(--border);object-fit:cover;}
  .img-remove{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.75);border:none;color:white;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}

  /* POST CARD */
  .post-card{border-bottom:1px solid var(--border);transition:background 0.1s;animation:fadeIn 0.25s ease;cursor:pointer;}
  .post-card:hover{background:rgba(255,255,255,0.02);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  .post-inner{display:flex;gap:12px;padding:12px 16px 0;}
  .avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:white;}
  .post-body{flex:1;min-width:0;padding-bottom:12px;}
  .post-header{display:flex;align-items:center;gap:4px;margin-bottom:2px;flex-wrap:wrap;}
  .post-name{font-weight:700;font-size:15px;color:var(--text);}
  .post-handle{color:var(--text2);font-size:14px;}
  .post-dot{color:var(--text2);font-size:14px;}
  .post-time{color:var(--text2);font-size:14px;}
  .post-more{margin-left:auto;background:none;border:none;color:var(--text2);cursor:pointer;font-size:18px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
  .post-more:hover{background:rgba(29,155,240,0.1);color:var(--accent);}
  .post-text{font-size:15px;line-height:1.6;margin-bottom:10px;word-break:break-word;color:var(--text);}
  .post-img{width:100%;border-radius:16px;margin-bottom:10px;max-height:400px;object-fit:cover;border:1px solid var(--border);display:block;}

  /* RT 인용 박스 */
  .quote-box{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;}
  .quote-box:hover{background:rgba(255,255,255,0.03);}
  .quote-header{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  .quote-avatar-sm{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:white;flex-shrink:0;}
  .quote-name{font-weight:700;font-size:13px;}
  .quote-handle{color:var(--text2);font-size:13px;}
  .quote-text{font-size:14px;color:var(--text);line-height:1.5;}

  /* AI 이미지 */
  .ai-img-card{width:100%;border-radius:16px;margin-bottom:10px;border:1px solid var(--border);overflow:hidden;position:relative;}
  .ai-img-inner{padding:32px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px;text-align:center;}
  .ai-img-emoji{font-size:56px;margin-bottom:10px;}
  .ai-img-caption{font-size:12px;color:var(--text2);}
  .ai-img-label{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.6);border-radius:4px;padding:2px 6px;font-size:10px;color:var(--text2);}

  /* ACTIONS */
  .post-actions{display:flex;justify-content:space-between;max-width:380px;margin-top:4px;}
  .action-btn{background:none;border:none;color:var(--text2);display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-family:var(--font);padding:6px;border-radius:9999px;transition:all 0.15s;min-width:40px;}
  .action-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .action-btn:hover.reply-btn{color:var(--accent);background:rgba(29,155,240,0.1);}
  .action-btn:hover.rt-btn{color:var(--rt);background:rgba(0,186,124,0.1);}
  .action-btn:hover.like-btn{color:var(--like);background:rgba(249,24,128,0.1);}
  .action-btn:hover.share-btn{color:var(--accent);background:rgba(29,155,240,0.1);}
  .action-btn.liked{color:var(--like);}
  .action-btn.rted{color:var(--rt);}
  .action-count{font-size:13px;}

  /* RT 팝업 */
  .rt-popup{position:fixed;background:#1e2732;border:1px solid var(--border);border-radius:16px;padding:4px 0;z-index:300;min-width:200px;box-shadow:0 4px 24px rgba(0,0,0,0.5);}
  .rt-popup-item{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;font-size:15px;font-weight:500;color:var(--text);transition:background 0.1s;}
  .rt-popup-item:hover{background:rgba(255,255,255,0.05);}
  .rt-popup-item svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;}
  .rt-overlay{position:fixed;inset:0;z-index:299;}

  /* 인용 모달 */
  .quote-modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;}
  .quote-modal-inner{background:#000;border:1px solid var(--border);border-radius:16px;width:100%;max-width:540px;padding:16px;}
  .quote-modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .quote-close{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .quote-close:hover{background:rgba(255,255,255,0.1);}
  .quote-composer{display:flex;gap:12px;margin-bottom:12px;}
  .quote-composer textarea{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:17px;resize:none;min-height:80px;}
  .quote-original{border:1px solid var(--border);border-radius:12px;padding:12px;}
  .quote-original-header{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:13px;}
  .quote-original-name{font-weight:700;color:var(--text);}
  .quote-original-handle{color:var(--text2);}
  .quote-original-text{font-size:14px;color:var(--text);line-height:1.5;}
  .quote-submit-row{display:flex;justify-content:flex-end;margin-top:12px;border-top:1px solid var(--border);padding-top:12px;}

  /* 트렌드 사이드바 느낌 - 탐라 상단 */
  .trend-bar{border-bottom:1px solid var(--border);padding:12px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
  .trend-bar::-webkit-scrollbar{display:none;}
  .trend-tag{background:rgba(29,155,240,0.1);color:var(--accent);border:1px solid rgba(29,155,240,0.3);border-radius:9999px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:background 0.15s;}
  .trend-tag:hover{background:rgba(29,155,240,0.2);}

  /* REPLIES (댓글) */
  .replies-wrap{border-top:1px solid var(--border);}
  .reply-item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);animation:fadeIn 0.2s ease;}
  .reply-item:last-child{border-bottom:none;}
  .reply-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:white;}
  .reply-body{flex:1;}
  .reply-header{display:flex;align-items:center;gap:4px;margin-bottom:2px;}
  .reply-name{font-weight:700;font-size:14px;}
  .reply-handle{color:var(--text2);font-size:13px;}
  .reply-time{color:var(--text2);font-size:13px;margin-left:4px;}
  .reply-text{font-size:14px;line-height:1.5;color:var(--text);}
  .reply-actions{display:flex;gap:16px;margin-top:8px;}
  .reply-like-btn{background:none;border:none;color:var(--text2);cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;font-family:var(--font);padding:4px;border-radius:9999px;transition:all 0.15s;}
  .reply-like-btn:hover{color:var(--like);background:rgba(249,24,128,0.1);}

  /* REPLY INPUT */
  .reply-input-wrap{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border);}
  .reply-input-wrap input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:14px;border-bottom:1px solid var(--border);padding-bottom:6px;}
  .reply-input-wrap input::placeholder{color:var(--text3);}
  .reply-submit{background:var(--accent);color:white;border:none;border-radius:9999px;padding:0 14px;height:32px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);}

  /* PROFILE */
  .profile-page{padding-bottom:80px;}
  .profile-banner{height:120px;background:linear-gradient(135deg,#1d9bf022,#1d9bf044);}
  .profile-header{padding:0 16px 16px;border-bottom:1px solid var(--border);}
  .profile-top{display:flex;justify-content:space-between;align-items:flex-end;margin-top:-36px;margin-bottom:12px;}
  .profile-avatar{width:72px;height:72px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:white;border:4px solid var(--bg);}
  .edit-btn{background:none;border:1px solid var(--border);color:var(--text);border-radius:9999px;padding:7px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);transition:background 0.15s;}
  .edit-btn:hover{background:rgba(255,255,255,0.05);}
  .profile-name{font-size:20px;font-weight:800;margin-bottom:2px;}
  .profile-handle{color:var(--text2);font-size:14px;margin-bottom:10px;}
  .profile-bio{font-size:14px;line-height:1.6;margin-bottom:12px;color:var(--text);}
  .profile-stats{display:flex;gap:20px;}
  .stat-item{font-size:14px;color:var(--text2);}
  .stat-item strong{color:var(--text);font-weight:700;}

  /* BOTTOM NAV */
  .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:rgba(0,0,0,0.9);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;height:53px;z-index:100;}
  .bnav-btn{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;padding:10px 20px;border-radius:9999px;transition:background 0.15s;}
  .bnav-btn:hover{background:rgba(255,255,255,0.05);}
  .bnav-btn.active{color:var(--text);}

  /* FAB */
  .fab{position:fixed;bottom:70px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;color:white;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(29,155,240,0.4);z-index:50;transition:background 0.15s;}
  .fab:hover{background:var(--accent-hover);}

  /* TOAST */
  .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1d9bf0;color:white;padding:12px 20px;border-radius:4px;font-size:14px;z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;font-weight:500;}
  .toast.show{opacity:1;}

  /* SETUP */
  .setup-page{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;}
  .setup-logo{font-size:32px;font-weight:800;color:var(--text);margin-bottom:4px;letter-spacing:-1px;}.setup-logo span{color:var(--accent);}
  .setup-sub{color:var(--text2);font-size:15px;margin-bottom:36px;}
  .setup-form{width:100%;max-width:360px;}
  .form-group{margin-bottom:20px;}
  .form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;}
  .form-group input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:12px 14px;color:var(--text);font-family:var(--font);font-size:15px;outline:none;transition:border-color 0.15s;}
  .form-group input:focus{border-color:var(--accent);}
  .setup-btn{width:100%;background:var(--text);color:var(--bg);border:none;border-radius:9999px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:var(--font);margin-top:8px;transition:opacity 0.15s;}
  .setup-btn:hover{opacity:0.85;}

  /* TYPING */
  .ai-typing{padding:12px 16px;color:var(--text2);font-size:13px;display:flex;align-items:center;gap:8px;}
  .typing-dots{display:flex;gap:4px;}
  .typing-dots span{width:4px;height:4px;border-radius:50%;background:var(--text2);animation:blink 1.2s infinite;}
  .typing-dots span:nth-child(2){animation-delay:0.2s;}
  .typing-dots span:nth-child(3){animation-delay:0.4s;}
  @keyframes blink{0%,80%,100%{opacity:0.3}40%{opacity:1}}

  .empty{text-align:center;padding:60px 20px;color:var(--text2);}
  #imgFileInput{display:none;}
  ::-webkit-scrollbar{width:0px;}
  .stat-label { font-size: 12px; color: var(--text3); }

  .fab { position: fixed; bottom: 80px; right: 20px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); border: none; color: white; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(255,69,69,0.4); z-index: 50; transition: transform 0.15s; }
  .fab:hover { transform: scale(1.05); }

  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(10,10,10,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; height: 56px; z-index: 100; }
  .bnav-btn { background: none; border: none; color: var(--text3); font-size: 24px; cursor: pointer; padding: 12px; position: relative; }
  .bnav-btn.active { color: var(--text); }

  .ai-typing { padding: 12px 16px; color: var(--text3); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .typing-dots { display: flex; gap: 4px; }
  .typing-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--text3); animation: blink 1.2s infinite; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.3} 40%{opacity:1} }

  .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }

  .setup-page { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; }
  .setup-logo { font-family: var(--mono); font-size: 36px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
  .setup-sub { color: var(--text3); font-size: 14px; margin-bottom: 40px; }
  .setup-form { width: 100%; max-width: 360px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; color: var(--text3); margin-bottom: 6px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 1px; }
  .form-group input, .form-group textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--text); font-family: var(--font); font-size: 14px; outline: none; transition: border-color 0.15s; }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
  .setup-btn { width: 100%; background: var(--accent); color: white; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--font); margin-top: 8px; transition: opacity 0.15s; }
  .setup-btn:hover { opacity: 0.9; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* 이미지 첨부 라벨 */
  .attach-label { cursor: pointer; color: var(--blue); font-size: 18px; }
  #imgFileInput { display: none; }

  /* 알림 배지 */
  .notif-badge { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
</style>
</head>
<body>

<!-- SETUP -->
<div class="setup-page" id="setupPage">
  <div class="setup-logo">X<span>.</span></div>
  <div class="setup-sub">지금 무슨 일이 일어나고 있나요?</div>
  <div class="setup-form">
    <div class="form-group"><label>이름</label><input type="text" id="setupName" placeholder="홍길동" maxlength="20"></div>
    <div class="form-group"><label>사용자 이름 (@없이)</label><input type="text" id="setupHandle" placeholder="honggildong" maxlength="20"></div>
    <div class="form-group"><label>소개</label><input type="text" id="setupBio" placeholder="자기소개를 입력하세요" maxlength="60"></div>
    <button class="setup-btn" onclick="completeSetup()">계정 만들기</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none;">
  <nav>
    <div class="avatar-sm" id="userAvatarNav" onclick="showPage('profile')" style="margin-right:8px;">나</div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showPage('feed')" id="tab-feed">홈</button>
      <button class="nav-tab" onclick="showPage('profile')" id="tab-profile">프로필</button>
    </div>
    <div style="width:40px;"></div>
  </nav>

  <!-- FEED PAGE -->
  <div class="page active" id="feedPage">
    <div class="composer">
      <div class="avatar" id="composerAvatar" style="background:#1d9bf0;">나</div>
      <div class="composer-body">
        <textarea id="postInput" placeholder="무슨 일이 일어나고 있나요?" rows="2"></textarea>
        <div id="imgPreviewWrap"></div>
        <div class="composer-divider"></div>
        <div class="composer-actions">

let state = { user: null, posts: [], postIdCounter: 0 };
let pendingImg = null;

// ─── 저장 / 복원 ─────────────────────────────────────────────
const STORAGE_KEY = 'void_sns_state';
function saveState() {
  try {
    // imgData(base64)는 용량이 커서 최근 30개 포스트만, imgData는 제외
    const toSave = {
      user: state.user,
      postIdCounter: state.postIdCounter,
      posts: state.posts.slice(-60).map(p => ({...p, imgData: p.imgData ? '__img__' : null})),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch(e) { console.warn('저장 실패', e); }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    if(!saved.user) return false;
    state.user = saved.user;
    state.postIdCounter = saved.postIdCounter || 0;
    // imgData '__img__' 복원 불가 → null 처리
    state.posts = (saved.posts||[]).map(p => ({...p, imgData: p.imgData === '__img__' ? null : p.imgData}));
    return true;
  } catch(e) { return false; }
}

// ─── 유틸 ───────────────────────────────────────────────────
function getAccount(id) { return AI_ACCOUNTS.find(a=>a.id===id); }
function randomAccount(excludeId) { let a=AI_ACCOUNTS.filter(a=>a.id!==excludeId); return a[Math.floor(Math.random()*a.length)]; }
function randomAccounts(n, excludeId) {
  let pool=[...AI_ACCOUNTS].filter(a=>a.id!==excludeId);
  for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  return pool.slice(0,n);
}
function timeAgo(ts) {
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return `${s}초`;
  if(s<3600) return `${Math.floor(s/60)}분`;
  if(s<86400) return `${Math.floor(s/3600)}시간`;
  return `${Math.floor(s/86400)}일`;
}
function esc(str) { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  const reader = new FileReader();
  reader.onload = function(ev) {
    pendingImg = ev.target.result; // base64
    const wrap = document.getElementById('imgPreviewWrap');
    wrap.innerHTML = `

        <img src="${pendingImg}" alt="첨부 이미지">
        <button class="img-remove" onclick="removePendingImg()">✕</button>
      </div>`;
  };

});

function initFeed(isNew = true) {
  if(isNew) {
    // 신규 유저: 시드 포스트 생성
    let baseTime = Date.now();
    SEED_POSTS.forEach((sp, i) => {
      const acc = getAccount(sp.account);
      const ts = baseTime - (i*8+Math.floor(Math.random()*5))*60*1000;
      const post = {
        id: ++state.postIdCounter,
        accountId: acc.id, name: acc.name, handle: acc.handle, emoji: acc.emoji, bg: acc.bg,
        text: sp.text, ts,
        likes: Math.floor(Math.random()*40), liked: false,
        comments: [], commentsLoaded: false,
        topic: sp.topic, isUser: false,
        hasImg: sp.hasImg||false,
        imgEmoji: sp.imgEmoji||null, imgBg: sp.imgBg||null,
        imgData: null,
      };
      state.posts.push(post);
    });
    setTimeout(()=>{ autoGenerateComments(); }, 800);
  }
  renderFeed();
  renderTrendBar();
  scheduleNextAIPost();
}

  if(!bar) return;
  // 랜덤 5개 트렌드 표시
  const shown = [...TRENDS].sort(()=>Math.random()-0.5).slice(0,5);
  bar.innerHTML = shown.map(t=>`<span class="trend-tag" onclick="clickTrend('${t}')">${t}</span>`).join('');
}
function clickTrend(tag) {
  document.getElementById('postInput').value = tag+' ';
  document.getElementById('postInput').focus();
  showPage('feed');
}

function scheduleNextAIPost() {
  const delay = 15000 + Math.random()*20000;
  setTimeout(async()=>{
    // 30% 확률로 AI가 기존 포스트를 인용해서 토론
    if(Math.random()<0.3 && state.posts.length>5) {
      await generateAIQuotePost();
    } else {
      await generateNewAIPost();
    }
    scheduleNextAIPost();
  }, delay);
}

// ─── 렌더링 ──────────────────────────────────────────────────
function renderFeed() {
  const container = document.getElementById('feedContainer');
  container.innerHTML = '';
  state.posts.slice().reverse().forEach(post => container.appendChild(renderPost(post)));
}

function renderPost(post) {

  div.onclick = (e) => { if(!e.target.closest('.action-btn')) toggleComments(post.id); };

    if(orig) quoteHtml = `
      <div class="quote-box" onclick="event.stopPropagation()">
        <div class="quote-header">
          <div class="quote-avatar-sm" style="background:${orig.bg};">${esc(orig.emoji||orig.name.slice(0,1))}</div>
          <span class="quote-name">${esc(orig.name)}</span>

        ${mediaHtml}
        ${quoteHtml}
        <div class="post-actions">

            <svg viewBox="0 0 24 24"><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 7.879 3.77 7.879 8.051 0 4.49-3.396 7.949-7.879 7.949H9.21c-.782 0-1.508-.508-1.729-1.262l-.065-.238A3.995 3.995 0 005.5 15.5H2.75a1 1 0 01-1-1V10z"/></svg>
            <span class="action-count">${post.comments.length||''}</span>

function addPostToFeed(post) {
  const container = document.getElementById('feedContainer');
  const el = renderPost(post);
  container.prepend(el);
}

function updatePostEl(post) {
  const el = document.getElementById('post-'+post.id);
  if(!el) return;
  const replyBtn = el.querySelector('.reply-btn .action-count');
  const rtBtn = el.querySelector('.rt-btn .action-count');
  const likeBtn = el.querySelector('.like-btn .action-count');
  if(replyBtn) replyBtn.textContent = post.comments.length||'';
  if(rtBtn) rtBtn.textContent = post.rts||'';
  if(likeBtn) likeBtn.textContent = post.likes||'';
  const likeBtnEl = el.querySelector('.like-btn');
  if(likeBtnEl) likeBtnEl.className = `action-btn like-btn ${post.liked?'liked':''}`;
  const rtBtnEl = el.querySelector('.rt-btn');
  if(rtBtnEl) rtBtnEl.className = `action-btn rt-btn ${post.rted?'rted':''}`;
}

// ─── 좋아요 ──────────────────────────────────────────────────
function toggleLike(postId) {
  const post = state.posts.find(p=>p.id===postId);
  if(!post) return;
  post.liked = !post.liked;
  post.likes = (post.likes||0) + (post.liked ? 1 : -1);
  updatePostEl(post);
  saveState();
}

// ─── RT 팝업 ─────────────────────────────────────────────────
function showRTPopup(e, postId) {
  e.stopPropagation();
  closeRTPopup();
  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();
  const overlay = document.createElement('div');
  overlay.className = 'rt-overlay';
  overlay.onclick = closeRTPopup;
  const popup = document.createElement('div');
  popup.className = 'rt-popup';
  popup.id = 'rt-popup';
  popup.style.top = (rect.bottom+4)+'px';
  popup.style.left = (rect.left-40)+'px';
  const post = state.posts.find(p=>p.id===postId);
  const isRted = post&&post.rted;
  popup.innerHTML = `
    <div class="rt-popup-item" onclick="doRepost(${postId})">
      <svg viewBox="0 0 24 24"><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46L18.5 16.45V8c0-1.1-.896-2-2-2z"/></svg>
      ${isRted?'재게시 취소':'재게시'}
    </div>
    <div class="rt-popup-item" onclick="openQuoteModal(${postId})">
      <svg viewBox="0 0 24 24"><path d="M21 3L3 10.5v1l6 2.5 2.5 6h1L21 3z"/></svg>
      인용
    </div>
  `;
  document.body.appendChild(overlay);
  document.body.appendChild(popup);
}

function closeRTPopup() {
  document.getElementById('rt-popup')?.remove();
  document.querySelectorAll('.rt-overlay').forEach(el=>el.remove());
}

function doRepost(postId) {
  closeRTPopup();
  const post = state.posts.find(p=>p.id===postId);
  if(!post) return;
  post.rted = !post.rted;
  post.rts = (post.rts||0) + (post.rted?1:-1);
  updatePostEl(post);
  if(post.rted) {
    // 탐라에 RT 포스트 추가
    const rtPost = {
      id: ++state.postIdCounter,
      accountId: 'user', name: post.name, handle: post.handle,
      emoji: post.emoji, bg: post.bg,
      text: post.text, ts: Date.now(),
      likes: post.likes, liked: false, rts: post.rts||0,
      comments: [...post.comments], commentsLoaded: true,
      isUser: false, hasImg: post.hasImg, imgData: post.imgData,
      imgEmoji: post.imgEmoji, imgBg: post.imgBg, imgCaption: post.imgCaption,
      rtBy: state.user.name, // 재게시 라벨
    };
    state.posts.push(rtPost);
    addPostToFeed(rtPost);
    showToast('재게시했습니다');
  } else {
    // RT 취소: rtBy가 내 이름인 포스트 제거
    const idx = state.posts.findIndex(p=>p.rtBy===state.user.name && p.text===post.text && p.id!==postId);
    if(idx>-1) {
      const el = document.getElementById('post-'+state.posts[idx].id);
      el?.remove();
      document.getElementById('comments-'+state.posts[idx].id)?.remove();
      state.posts.splice(idx,1);
      showToast('재게시를 취소했습니다');
    }
  }
  saveState();
}

// ─── 인용 모달 ────────────────────────────────────────────────
function openQuoteModal(postId) {
  closeRTPopup();
  const post = state.posts.find(p=>p.id===postId);
  if(!post) return;
  const modal = document.createElement('div');
  modal.className = 'quote-modal';
  modal.id = 'quote-modal';
  modal.innerHTML = `
    <div class="quote-modal-inner">
      <div class="quote-modal-header">
        <button class="quote-close" onclick="closeQuoteModal()">✕</button>
        <button class="post-btn" onclick="submitQuote(${postId})">게시하기</button>
      </div>
      <div class="quote-composer">
        <div class="avatar" style="background:#1d9bf0;">${esc(state.user.name.slice(0,1))}</div>
        <textarea id="quoteInput" placeholder="인용에 추가하기..."></textarea>
      </div>
      <div class="quote-original">
        <div class="quote-original-header">
          <div style="width:16px;height:16px;border-radius:50%;background:${post.bg};display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:white;">${esc(post.emoji||post.name.slice(0,1))}</div>
          <span class="quote-original-name">${esc(post.name)}</span>
          <span class="quote-original-handle">@${esc(post.handle)}</span>
        </div>
        <div class="quote-original-text">${esc(post.text).replace(/\n/g,'<br>')}</div>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  setTimeout(()=>document.getElementById('quoteInput')?.focus(),100);
}

function closeQuoteModal() { document.getElementById('quote-modal')?.remove(); }

function submitQuote(postId) {
  const input = document.getElementById('quoteInput');
  const text = (input?.value||'').trim();
  closeQuoteModal();
  const orig = state.posts.find(p=>p.id===postId);
  if(!orig) return;
  const qPost = {
    id: ++state.postIdCounter,
    accountId:'user', name:state.user.name, handle:state.user.handle,
    emoji:state.user.name.slice(0,1), bg:'#1d9bf0',
    text: text||'📌', ts: Date.now(),
    likes:0, liked:false, rts:0, comments:[], commentsLoaded:true,
    isUser:true, quoteOf:postId,
  };
  state.posts.push(qPost);
  addPostToFeed(qPost);
  orig.rts = (orig.rts||0)+1;
  updatePostEl(orig);
  showToast('인용 게시물을 올렸습니다');
  saveState();
}

// ─── 댓글 토글 ───────────────────────────────────────────────
async function toggleComments(postId) {
  const post = state.posts.find(p=>p.id===postId);
  const section = document.getElementById('comments-'+postId);
  if(!section) return;
  if(section.style.display==='none') {
    section.style.display='block';
    renderComments(post, section);
    if(!post.commentsLoaded && !post.isUser) {
      post.commentsLoaded = true;
      await generateCommentsForPost(post, section, 2+Math.floor(Math.random()*3));
    }
  } else {
    section.style.display='none';
  }
}

function renderComments(post, section) {
  section.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'replies-wrap';
  post.comments.forEach(c => wrap.appendChild(renderComment(c)));
  section.appendChild(wrap);
  const inputWrap = document.createElement('div');
  inputWrap.className = 'reply-input-wrap';
  inputWrap.innerHTML = `
    <div class="reply-avatar" style="background:#1d9bf0;">${esc(state.user.name.slice(0,1))}</div>
    <input type="text" placeholder="답글 게시하기" id="ci-${post.id}">
    <button class="reply-submit" onclick="submitComment(${post.id})">답글</button>
  `;
  section.appendChild(inputWrap);
}

function renderComment(c) {
  const div = document.createElement('div');
  div.className = 'reply-item';
  div.innerHTML = `
    <div class="reply-avatar" style="background:${c.bg||'#555'};">${esc(c.emoji||c.name.slice(0,1))}</div>
    <div class="reply-body">
      <div class="reply-header">
        <span class="reply-name">${esc(c.name)}</span>
        <span class="reply-handle">@${esc(c.handle)}</span>
        <span class="reply-time">· ${timeAgo(c.ts)}</span>
      </div>
      <div class="reply-text">${esc(c.text).replace(/\n/g,'<br>')}</div>
      <div class="reply-actions">
        <button class="reply-like-btn">♡ ${c.likes||0}</button>
      </div>
    </div>
  `;
  return div;
}

// ─── 댓글 제출 (사용자) ─────────────────────────────────────
async function submitComment(postId) {
  const input = document.getElementById('ci-'+postId);
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  const post = state.posts.find(p=>p.id===postId);
  const comment = {
    id: Date.now(), name: state.user.name, handle: state.user.handle,
    bg: '#ff4545', emoji: state.user.name.slice(0,1),
    text, ts: Date.now(), likes: 0, isUser: true,
  };
  post.comments.push(comment);
  const section = document.getElementById('comments-'+postId);
  renderComments(post, section);
  updatePostEl(post);
  // AI 답글 (더 높은 확률)
  const replyCount = Math.random()<0.4 ? 2 : Math.random()<0.7 ? 1 : 0;
  for(let i=0; i<replyCount; i++) {
    setTimeout(()=>addAICommentReply(post, comment, section), (i+1)*(2000+Math.random()*3000));
  }
}

// ─── AI 댓글 생성 ────────────────────────────────────────────
async function generateCommentsForPost(post, section, count) {
  const commenters = randomAccounts(count, post.accountId);
  for(let i=0; i<commenters.length; i++) {
    await new Promise(r=>setTimeout(r, 500+Math.random()*1000));
    const acc = commenters[i];
    const text = await callClaudeForComment(post, acc);
    if(!text) continue;
    const comment = {
      id: Date.now()+i, name: acc.name, handle: acc.handle, bg: acc.bg, emoji: acc.emoji,
      text, ts: Date.now()-Math.floor(Math.random()*300000),
      likes: Math.floor(Math.random()*15),
    };
    post.comments.push(comment);
    const wrap = section.querySelector('.comments-section');
    if(wrap) wrap.appendChild(renderComment(comment));
    updatePostEl(post);
    saveState();
  }
}

async function autoGenerateComments() {
  const targets = state.posts.filter(p=>!p.commentsLoaded).slice(0,6);
  for(const post of targets) {
    post.commentsLoaded = true;
    if(Math.random()<0.65) {
      const count = Math.floor(Math.random()*4)+1;
      const commenters = randomAccounts(count, post.accountId);
      for(const acc of commenters) {
        const text = await callClaudeForComment(post, acc);
        if(!text) continue;
        post.comments.push({
          id: Date.now()+Math.random(), name: acc.name, handle: acc.handle, bg: acc.bg, emoji: acc.emoji,
          text, ts: post.ts+Math.floor(Math.random()*600000),
          likes: Math.floor(Math.random()*12),
        });
        await new Promise(r=>setTimeout(r,200));
      }
      if(Math.random()<0.5) post.likes += Math.floor(Math.random()*8)+1;
      updatePostEl(post);
    }
  }
}

async function addAICommentReply(post, userComment, section) {
  const acc = randomAccount(post.accountId);
  const text = await callClaudeForReply(post, userComment, acc);
  if(!text) return;
  const comment = { id: Date.now(), name: acc.name, handle: acc.handle, bg: acc.bg, emoji: acc.emoji, text, ts: Date.now(), likes: 0 };
  post.comments.push(comment);
  if(section&&section.style.display!=='none') {
    const wrap = section.querySelector('.comments-section');
    if(wrap) wrap.appendChild(renderComment(comment));
  }
  updatePostEl(post);
}

// ─── AI 인용 토론 포스트 ──────────────────────────────────────
async function generateAIQuotePost() {
  // 최근 포스트 중 하나를 골라 다른 AI가 인용
  const targets = state.posts.filter(p=>!p.rtBy&&!p.quoteOf).slice(-20);
  if(!targets.length) return;
  const orig = targets[Math.floor(Math.random()*targets.length)];
  const acc = randomAccount(orig.accountId);

  const prompt = `너는 한국 트위터 유저 "${acc.name}"(${acc.type}, 말투: ${acc.tone})야.
아래 트윗을 인용해서 한마디 해. 동의/반박/드립/공감 뭐든 OK.

원트윗: ${orig.text}

규칙:
- 1~2줄, 짧게
- ㅋㅋ ㄹㅇ 등 트위터 말투
- 텍스트만 출력`;

  const text = await callClaude(prompt, 100);
  if(!text) return;

  const qPost = {
    id: ++state.postIdCounter,
    accountId: acc.id, name: acc.name, handle: acc.handle, emoji: acc.emoji, bg: acc.bg,
    text, ts: Date.now(),
    likes: Math.floor(Math.random()*15), liked: false, rts: 0,
    comments: [], commentsLoaded: false,
    isUser: false, quoteOf: orig.id,
  };
  state.posts.push(qPost);
  addPostToFeed(qPost);
  orig.rts = (orig.rts||0)+1;
  updatePostEl(orig);
  saveState();
}

// ─── AI 새 포스트 생성 ───────────────────────────────────────
// 이전 포스트 내용을 컨텍스트로 넘겨 다양한 글 유도
async function generateNewAIPost() {
  const acc = randomAccount(null);
  const topics = ['게임','음식','일상','밈','공부','연애','운동','영화','음악','직장','취업','날씨','산책','쇼핑','기분'];

  // 최근 AI 포스트 내용 (중복 방지)
  const recentTexts = state.posts.filter(p=>!p.isUser).slice(-5).map(p=>p.text).join(' / ');

  // 이미지 포스트 여부 (25% 확률)
  const withImg = Math.random() < 0.25;
  const topic = topics[Math.floor(Math.random()*topics.length)];

  const text = await callClaudeForPost(acc, topic, recentTexts, withImg);
  if(!text) return;

  let imgData = null;
  let imgEmoji = null;
  let imgBg = null;
  let imgCaption = null;

  if(withImg) {
    // 주제에 맞는 이모지 이미지 선택
    const imgMap = {
      '음식':['🍜','🍕','🍣','🍔','🥘','🍱'],
      '운동':['💪','🏃','🧘','🏋️'],
      '여행':['🌅','🗼','🌊','⛰️'],
      '일상':['☕','🌙','🪴','🛋️'],
      '게임':['🎮','🕹️','👾'],
      '고양이':['🐱','🐈'],
      '공부':['📚','✏️','📖'],
      '음악':['🎵','🎤','🎧'],
    };
    const topicKey = Object.keys(imgMap).find(k=>topic.includes(k)||acc.interests.some(i=>i.includes(k)));
    const emojiList = topicKey ? imgMap[topicKey] : ['📸','🌿','✨'];
    imgEmoji = emojiList[Math.floor(Math.random()*emojiList.length)];
    imgBg = ['#0a0a14','#140a0a','#0a140a','#0d0d1a','#1a0d0a'][Math.floor(Math.random()*5)];
    imgCaption = topic;
  }

  const post = {
    id: ++state.postIdCounter,
    accountId: acc.id, name: acc.name, handle: acc.handle, emoji: acc.emoji, bg: acc.bg,
    text, ts: Date.now(),
    likes: Math.floor(Math.random()*20), liked: false,
    comments: [], commentsLoaded: false,
    topic, isUser: false,
    hasImg: withImg, imgData, imgEmoji, imgBg, imgCaption,
  };
  state.posts.push(post);
  addPostToFeed(post);
  saveState();

  // 댓글 달기
  if(Math.random()<0.55) {
    const section = document.getElementById('comments-'+post.id);
    if(section) {
      post.commentsLoaded = true;
      await generateCommentsForPost(post, section, 1+Math.floor(Math.random()*2));
    }
  }
}

// ─── Claude API 호출 ─────────────────────────────────────────

  const lengthHint = dice<0.5 ? '10자 이하 초단문' : dice<0.85 ? '1~2문장' : '3~5문장';
  const hasImage = post.hasImg || post.imgData;
  const imgNote = hasImage ? `\n게시물에 사진도 첨부됨 (이모지: ${post.imgEmoji||'사진'})` : '';

  const prompt = `너는 한국 SNS 사용자 "${commenter.name}"(타입: ${commenter.type}, 말투: ${commenter.tone})이야.
아래 게시물에 댓글을 달아.${imgNote}

게시물 작성자: ${post.name}
게시물 내용: ${post.text}

규칙:
- 절대 챗봇처럼 말하지 마 ("힘드셨겠네요" 같은 거 금지)
- 실제 한국 SNS 댓글처럼 자연스럽게
- 줄임말, ㅋㅋ, ㅠㅠ 같은 표현 자유롭게
- 길이: ${lengthHint}
- 댓글 텍스트만 출력 (설명 없이)`;

  return callClaude(prompt, 100);
}

아래 댓글에 리플 달아.

// 새 포스트 생성 - 최근 글 컨텍스트와 다양성 강조
async function callClaudeForPost(acc, topic, recentTexts='', withImg=false) {
  const imgHint = withImg ? '\n사진을 첨부하는 포스트야. 사진 찍었다는 언급 포함해.' : '';
  // 타입별 상황 다양화
  const situations = {
    '일상': ['방금 일어남','퇴근함','밥 먹는 중','산책 중','멍 때리는 중','방 청소하다가','유튜브 보다가','잠 못 자고 있음'],
    '게임': ['방금 졌음','연승 중','캐릭터 키우는 중','버그 발견','신맵 나옴','팀원이 문제','업데이트 후 망함'],
    '음식': ['방금 먹음','먹으러 감','배달 시킴','직접 요리함','맛집 발견','실망한 음식','야식 고민 중'],
    '공부': ['도서관에서','카페에서','집에서','시험 앞두고','포기하고 싶음','집중 안 됨','드디어 이해됨'],
  };
  const situation = (situations[topic]||situations['일상'])[Math.floor(Math.random()*8)];

  const prompt = `너는 한국 트위터 유저 "${acc.name}"(${acc.type}, 말투: ${acc.tone})야.
상황: ${situation} / 주제: ${topic}
${imgHint}

한국 트위터에 글 올려. 아래 최근 글들과 다른 내용으로.
최근: ${recentTexts.slice(0,150)||'없음'}

규칙:
- 1~2줄이 기본. 절대 길게 쓰지 마 (장문형도 3줄 최대)
- ㅋㅋ ㅠㅠ ㄹㅇ 임 함 됨 등 줄임말 필수
- 유행어/밈 자연스럽게 섞기
- 텍스트만 출력`;

  return callClaude(prompt, 120);
}

// 사용자 게시물에 반응하는 AI (이미지 있으면 이미지 언급)
async function callClaudeForUserPostComment(post, commenter) {
  const hasImage = post.hasImg || post.imgData;
  const imgNote = hasImage ? '\n(사용자가 사진을 함께 올렸음. 사진 내용에 반응해도 됨)' : '';

  const prompt = `너는 한국 SNS 사용자 "${commenter.name}"(타입: ${commenter.type}, 말투: ${commenter.tone})이야.
사용자가 올린 게시물에 댓글 달아.${imgNote}

게시물: ${post.text}

규칙:
- 짧고 자연스럽게 (1~2문장)
- 실제 SNS 댓글처럼
- 사진 있으면 사진에도 반응 가능 ("사진 좋다", "어디임" 등)
- 댓글 텍스트만 출력`;

  return callClaude(prompt, 100);
}

async function callClaude(prompt, maxTokens=200) {
  try {
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        contents:[{ parts:[{ text: prompt }] }],
        generationConfig:{ maxOutputTokens: maxTokens, temperature: 1.0 }
      })
    });
    const data = await res.json();
    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    return text ? text.trim() : null;
  } catch(e) {
    console.error(e);
    return null;
  }
}

// ─── 사용자 게시물 작성 ──────────────────────────────────────
async function submitPost() {
  const input = document.getElementById('postInput');
  const text = input.value.trim();
  if(!text && !pendingImg) return;
  const imgData = pendingImg;
  input.value = '';
  removePendingImg();

  const post = {
    id: ++state.postIdCounter,
    accountId: 'user', name: state.user.name, handle: state.user.handle,
    emoji: state.user.name.slice(0,1), bg:'#ff4545',
    text: text||'📷', ts: Date.now(),
    likes: 0, liked: false, comments: [], commentsLoaded: true,
    isUser: true,
    hasImg: !!imgData, imgData: imgData||null, imgEmoji:null, imgBg:null,
  };
  state.posts.push(post);
  addPostToFeed(post);
  document.getElementById('statPosts').textContent = state.posts.filter(p=>p.isUser).length;
  showToast('게시됨 ✓');
  saveState();

  // AI들이 반응
  const respondCount = Math.floor(Math.random()*4)+2;
  const commenters = randomAccounts(respondCount, null);
  for(let i=0; i<commenters.length; i++) {
    setTimeout(async()=>{
      const acc = commenters[i];
      const t = await callClaudeForUserPostComment(post, acc);
      if(!t) return;
      const comment = {
        id: Date.now()+i, name: acc.name, handle: acc.handle, bg: acc.bg, emoji: acc.emoji,
        text: t, ts: Date.now(), likes: Math.floor(Math.random()*5),
      };
      post.comments.push(comment);
      if(Math.random()<0.5) post.likes++;
      updatePostEl(post);
      saveState();
      const section = document.getElementById('comments-'+post.id);
      if(section&&section.style.display!=='none') {
        const wrap = section.querySelector('.comments-section');
        if(wrap) wrap.appendChild(renderComment(comment));
      }
    }, (i+1)*(2000+Math.random()*4000));
  }
}

// ─── UI 유틸 ─────────────────────────────────────────────────
function showPage(page) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(t=>t.classList.remove('active'));
  document.getElementById(page+'Page').classList.add('active');
  const navTab = document.getElementById('tab-'+page);
  const bnavBtn = document.getElementById('bnav-'+page);
  if(navTab) navTab.classList.add('active');
  if(bnavBtn) bnavBtn.classList.add('active');
  if(page==='profile') renderMyProfile();
}

function renderMyProfile() {
  const myPosts = state.posts.filter(p=>p.isUser).reverse();
  const feed = document.getElementById('myFeed');
  feed.innerHTML = '';
  if(myPosts.length===0) {
    feed.innerHTML = '<div class="empty"><div class="empty-icon">🌑</div><div>아직 게시물이 없어요</div></div>';
    return;
  }
  myPosts.forEach(p=>{ feed.appendChild(renderPost(p)); });
  document.getElementById('statPosts').textContent = myPosts.length;
  document.getElementById('statLikes').textContent = myPosts.reduce((s,p)=>s+p.likes,0);
}

function focusComposer() {
  showPage('feed');
  document.getElementById('postInput').focus();
}

function sharePost(id) { showToast('링크가 복사됐어요'); }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2500);
}

document.addEventListener('keydown', e => {
  if(e.key==='Enter' && e.ctrlKey && document.getElementById('postInput')===document.activeElement) {
    submitPost();
  }
});
