  :root {
    --bg: #0a0a0a; --bg2: #111111; --bg3: #181818;
    --border: #242424; --text: #e8e8e8; --text2: #888; --text3: #555;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; min-height: 100vh; max-width: 480px; margin: 0 auto; }

  nav { position: sticky; top: 0; z-index: 100; background: rgba(10,10,10,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 52px; }

  .nav-right { display: flex; align-items: center; gap: 12px; }
  .avatar-sm { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; cursor: pointer; overflow: hidden; flex-shrink: 0; }

  .page { display: none; }
  .page.active { display: block; }
  .feed { padding-bottom: 80px; }

  .composer { border-bottom: 1px solid var(--border); padding: 16px; display: flex; gap: 12px; }
  .composer-body { flex: 1; }

  .composer textarea::placeholder { color: var(--text3); }
  .composer-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .composer-tools { display: flex; gap: 16px; }
  .composer-tools button { background: none; border: none; color: var(--blue); cursor: pointer; font-size: 18px; }
  .post-btn { background: var(--accent); color: white; border: none; border-radius: 20px; padding: 7px 18px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--font); transition: opacity 0.15s; }
  .post-btn:hover { opacity: 0.85; }

  /* 이미지 미리보기 */
  .img-preview-wrap { margin-top: 10px; position: relative; display: inline-block; }
  .img-preview-wrap img { max-width: 100%; max-height: 200px; border-radius: 10px; border: 1px solid var(--border); }
  .img-remove { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.7); border: none; color: white; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }

  .post-card { border-bottom: 1px solid var(--border); padding: 16px; display: flex; gap: 12px; cursor: pointer; transition: background 0.1s; animation: fadeIn 0.3s ease; }

  .avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: white; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .post-body { flex: 1; min-width: 0; }
  .post-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .post-name { font-weight: 700; font-size: 14px; }
  .post-handle { color: var(--text3); font-size: 13px; }
  .post-time { color: var(--text3); font-size: 12px; margin-left: auto; }
  .post-text { font-size: 15px; line-height: 1.6; margin-bottom: 12px; word-break: break-word; }
  .post-img { width: 100%; border-radius: 10px; margin-bottom: 12px; max-height: 320px; object-fit: cover; border: 1px solid var(--border); display: block; }

  .ai-img-caption { font-size: 12px; color: var(--text3); font-family: var(--mono); }
  .ai-img-label { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); border-radius: 4px; padding: 2px 6px; font-size: 10px; color: var(--text3); font-family: var(--mono); }

  .post-actions { display: flex; gap: 20px; }
  .action-btn { background: none; border: none; color: var(--text3); display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 13px; font-family: var(--font); transition: color 0.15s; padding: 0; }

  .action-btn.liked { color: var(--accent); }

  .comments-section { padding: 0 16px 16px; border-bottom: 1px solid var(--border); }
  .comment-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #1a1a1a; animation: fadeIn 0.25s ease; }
  .comment-item:last-child { border-bottom: none; }
  .comment-avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; }

  .comment-like:hover { color: var(--accent); }

  .profile-page { padding-bottom: 80px; }

  .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .edit-btn { background: none; border: 1px solid var(--border); color: var(--text); border-radius: 20px; padding: 6px 16px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: var(--font); transition: background 0.15s; }

  .profile-name { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
  .profile-handle { color: var(--text3); font-size: 14px; margin-bottom: 10px; }
  .profile-bio { font-size: 14px; line-height: 1.6; margin-bottom: 12px; color: var(--text2); }
  .profile-stats { display: flex; gap: 20px; }
  .stat-item { text-align: center; }
  .stat-num { font-size: 18px; font-weight: 700; display: block; }
  .stat-label { font-size: 12px; color: var(--text3); }

  .fab { position: fixed; bottom: 80px; right: 20px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); border: none; color: white; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(255,69,69,0.4); z-index: 50; transition: transform 0.15s; }
  .fab:hover { transform: scale(1.05); }

  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(10,10,10,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; height: 56px; z-index: 100; }

  .ai-typing { padding: 12px 16px; color: var(--text3); font-size: 13px; display: flex; align-items: center; gap: 8px; }

  .typing-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--text3); animation: blink 1.2s infinite; }

  .form-group input, .form-group textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--text); font-family: var(--font); font-size: 14px; outline: none; transition: border-color 0.15s; }

  .setup-btn { width: 100%; background: var(--accent); color: white; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--font); margin-top: 8px; transition: opacity 0.15s; }

<div class="setup-page" id="setupPage">

let state = { user: null, posts: [], postIdCounter: 0 };
let pendingImg = null;

// ─── 저장 / 복원 ─────────────────────────────────────────────
const STORAGE_KEY = 'void_sns_state';
function saveState() {
  try {
    // imgData(base64)는 용량이 커서 최근 30개 포스트만, imgData는 제외
    const toSave = {
      user: state.user,
      postIdCounter: state.postIdCounter,
      posts: state.posts.slice(-60).map(p => ({...p, imgData: p.imgData ? '__img__' : null})),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch(e) { console.warn('저장 실패', e); }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    if(!saved.user) return false;
    state.user = saved.user;
    state.postIdCounter = saved.postIdCounter || 0;
    // imgData '__img__' 복원 불가 → null 처리
    state.posts = (saved.posts||[]).map(p => ({...p, imgData: p.imgData === '__img__' ? null : p.imgData}));
    return true;
  } catch(e) { return false; }
}

// ─── 유틸 ───────────────────────────────────────────────────
function getAccount(id) { return AI_ACCOUNTS.find(a=>a.id===id); }
function randomAccount(excludeId) { let a=AI_ACCOUNTS.filter(a=>a.id!==excludeId); return a[Math.floor(Math.random()*a.length)]; }
function randomAccounts(n, excludeId) {
  let pool=[...AI_ACCOUNTS].filter(a=>a.id!==excludeId);
  for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  return pool.slice(0,n);
}
function timeAgo(ts) {
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return `${s}초`;
  if(s<3600) return `${Math.floor(s/60)}분`;
  if(s<86400) return `${Math.floor(s/3600)}시간`;
  return `${Math.floor(s/86400)}일`;
}
function esc(str) { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function initFeed(isNew = true) {
  if(isNew) {
    // 신규 유저: 시드 포스트 생성
    let baseTime = Date.now();
    SEED_POSTS.forEach((sp, i) => {
      const acc = getAccount(sp.account);
      const ts = baseTime - (i*8+Math.floor(Math.random()*5))*60*1000;
      const post = {
        id: ++state.postIdCounter,
        accountId: acc.id, name: acc.name, handle: acc.handle, emoji: acc.emoji, bg: acc.bg,
        text: sp.text, ts,
        likes: Math.floor(Math.random()*40), liked: false,
        comments: [], commentsLoaded: false,
        topic: sp.topic, isUser: false,
        hasImg: sp.hasImg||false,
        imgEmoji: sp.imgEmoji||null, imgBg: sp.imgBg||null,
        imgData: null,
      };
      state.posts.push(post);
    });
    setTimeout(()=>{ autoGenerateComments(); }, 800);
  }
  renderFeed();
  scheduleNextAIPost();
}

function scheduleNextAIPost() {
  const delay = 15000 + Math.random()*20000;
  setTimeout(async()=>{
    await generateNewAIPost();
    scheduleNextAIPost();
  }, delay);
}

function addPostToFeed(post) {
  const container = document.getElementById('feedContainer');
  const el = renderPost(post);
  container.prepend(el);
}

function updatePostEl(post) {
  const el = document.getElementById('post-'+post.id);
  if(!el) return;
  const btns = el.querySelectorAll('.action-btn');
  if(btns[0]) {
    btns[0].className = `action-btn ${post.liked?'liked':''}`;
    btns[0].innerHTML = `<span class="icon">${post.liked?'♥':'♡'}</span> ${post.likes}`;
  }
  if(btns[1]) btns[1].innerHTML = `<span class="icon">💬</span> ${post.comments.length}`;
}

// ─── 좋아요 ──────────────────────────────────────────────────
function toggleLike(postId) {
  const post = state.posts.find(p=>p.id===postId);
  if(!post) return;
  post.liked = !post.liked;
  post.likes += post.liked ? 1 : -1;
  updatePostEl(post);
  saveState();
}

// ─── 댓글 토글 ───────────────────────────────────────────────
async function toggleComments(postId) {
  const post = state.posts.find(p=>p.id===postId);
  const section = document.getElementById('comments-'+postId);
  if(!section) return;
  if(section.style.display==='none') {
    section.style.display='block';
    renderComments(post, section);
    if(!post.commentsLoaded && !post.isUser) {
      post.commentsLoaded = true;
      await generateCommentsForPost(post, section, 2+Math.floor(Math.random()*3));
    }
  } else {
    section.style.display='none';
  }
}

function renderComments(post, section) {
  section.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'comments-section';
  post.comments.forEach(c => wrap.appendChild(renderComment(c)));
  section.appendChild(wrap);
  const inputWrap = document.createElement('div');
  inputWrap.style.cssText = 'display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);';
  inputWrap.innerHTML = `
    <div class="comment-avatar" style="background:#ff4545;">${esc(state.user.name.slice(0,1))}</div>
    <div style="flex:1;">
      <input type="text" placeholder="댓글 달기..." style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:8px 14px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;" id="ci-${post.id}">
    </div>
    <button onclick="submitComment(${post.id})" style="background:none;border:none;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);">게시</button>
  `;
  section.appendChild(inputWrap);
}

function renderComment(c) {
  const div = document.createElement('div');
  div.className = 'comment-item';
  div.innerHTML = `
    <div class="comment-avatar" style="background:${c.bg||'#555'};">${esc(c.emoji||c.name.slice(0,1))}</div>
    <div class="comment-body">
      <div class="comment-header">
        <span class="comment-name">${esc(c.name)}</span>
        <span class="comment-handle">@${esc(c.handle)}</span>
        <span class="comment-time">${timeAgo(c.ts)}</span>
      </div>
      <div class="comment-text">${esc(c.text).replace(/\n/g,'<br>')}</div>
      <button class="comment-like">♡ ${c.likes||0}</button>
    </div>
  `;
  return div;
}

// ─── 댓글 제출 (사용자) ─────────────────────────────────────
async function submitComment(postId) {
  const input = document.getElementById('ci-'+postId);
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  const post = state.posts.find(p=>p.id===postId);
  const comment = {
    id: Date.now(), name: state.user.name, handle: state.user.handle,
    bg: '#ff4545', emoji: state.user.name.slice(0,1),
    text, ts: Date.now(), likes: 0, isUser: true,
  };
  post.comments.push(comment);
  const section = document.getElementById('comments-'+postId);
  renderComments(post, section);
  updatePostEl(post);
  // AI 답글 (더 높은 확률)
  const replyCount = Math.random()<0.4 ? 2 : Math.random()<0.7 ? 1 : 0;
  for(let i=0; i<replyCount; i++) {
    setTimeout(()=>addAICommentReply(post, comment, section), (i+1)*(2000+Math.random()*3000));
  }
}

// ─── AI 댓글 생성 ────────────────────────────────────────────
async function generateCommentsForPost(post, section, count) {
  const commenters = randomAccounts(count, post.accountId);
  for(let i=0; i<commenters.length; i++) {
    await new Promise(r=>setTimeout(r, 500+Math.random()*1000));
    const acc = commenters[i];
    const text = await callClaudeForComment(post, acc);
    if(!text) continue;
    const comment = {
      id: Date.now()+i, name: acc.name, handle: acc.handle, bg: acc.bg, emoji: acc.emoji,
      text, ts: Date.now()-Math.floor(Math.random()*300000),
      likes: Math.floor(Math.random()*15),
    };
    post.comments.push(comment);
    const wrap = section.querySelector('.comments-section');
    if(wrap) wrap.appendChild(renderComment(comment));
    updatePostEl(post);
    saveState();
  }
}

async function autoGenerateComments() {
  const targets = state.posts.filter(p=>!p.commentsLoaded).slice(0,6);
  for(const post of targets) {
    post.commentsLoaded = true;
    if(Math.random()<0.65) {
      const count = Math.floor(Math.random()*4)+1;
      const commenters = randomAccounts(count, post.accountId);
      for(const acc of commenters) {
        const text = await callClaudeForComment(post, acc);
        if(!text) continue;
        post.comments.push({
          id: Date.now()+Math.random(), name: acc.name, handle: acc.handle, bg: acc.bg, emoji: acc.emoji,
          text, ts: post.ts+Math.floor(Math.random()*600000),
          likes: Math.floor(Math.random()*12),
        });
        await new Promise(r=>setTimeout(r,200));
      }
      if(Math.random()<0.5) post.likes += Math.floor(Math.random()*8)+1;
      updatePostEl(post);
    }
  }
}

async function addAICommentReply(post, userComment, section) {
  const acc = randomAccount(post.accountId);
  const text = await callClaudeForReply(post, userComment, acc);
  if(!text) return;
  const comment = { id: Date.now(), name: acc.name, handle: acc.handle, bg: acc.bg, emoji: acc.emoji, text, ts: Date.now(), likes: 0 };
  post.comments.push(comment);
  if(section&&section.style.display!=='none') {
    const wrap = section.querySelector('.comments-section');
    if(wrap) wrap.appendChild(renderComment(comment));
  }
  updatePostEl(post);
}

// ─── AI 새 포스트 생성 ───────────────────────────────────────
// 이전 포스트 내용을 컨텍스트로 넘겨 다양한 글 유도
async function generateNewAIPost() {
  const acc = randomAccount(null);
  const topics = ['게임','음식','일상','밈','공부','연애','운동','영화','음악','직장','취업','날씨','산책','쇼핑','기분'];

  // 최근 AI 포스트 내용 (중복 방지)
  const recentTexts = state.posts.filter(p=>!p.isUser).slice(-5).map(p=>p.text).join(' / ');

  // 이미지 포스트 여부 (25% 확률)
  const withImg = Math.random() < 0.25;
  const topic = topics[Math.floor(Math.random()*topics.length)];

  const text = await callClaudeForPost(acc, topic, recentTexts, withImg);
  if(!text) return;

  let imgData = null;
  let imgEmoji = null;
  let imgBg = null;
  let imgCaption = null;

  if(withImg) {
    // 주제에 맞는 이모지 이미지 선택
    const imgMap = {
      '음식':['🍜','🍕','🍣','🍔','🥘','🍱'],
      '운동':['💪','🏃','🧘','🏋️'],
      '여행':['🌅','🗼','🌊','⛰️'],
      '일상':['☕','🌙','🪴','🛋️'],
      '게임':['🎮','🕹️','👾'],
      '고양이':['🐱','🐈'],
      '공부':['📚','✏️','📖'],
      '음악':['🎵','🎤','🎧'],
    };
    const topicKey = Object.keys(imgMap).find(k=>topic.includes(k)||acc.interests.some(i=>i.includes(k)));
    const emojiList = topicKey ? imgMap[topicKey] : ['📸','🌿','✨'];
    imgEmoji = emojiList[Math.floor(Math.random()*emojiList.length)];
    imgBg = ['#0a0a14','#140a0a','#0a140a','#0d0d1a','#1a0d0a'][Math.floor(Math.random()*5)];
    imgCaption = topic;
  }

  const post = {
    id: ++state.postIdCounter,
    accountId: acc.id, name: acc.name, handle: acc.handle, emoji: acc.emoji, bg: acc.bg,
    text, ts: Date.now(),
    likes: Math.floor(Math.random()*20), liked: false,
    comments: [], commentsLoaded: false,
    topic, isUser: false,
    hasImg: withImg, imgData, imgEmoji, imgBg, imgCaption,
  };
  state.posts.push(post);
  addPostToFeed(post);
  saveState();

  // 댓글 달기
  if(Math.random()<0.55) {
    const section = document.getElementById('comments-'+post.id);
    if(section) {
      post.commentsLoaded = true;
      await generateCommentsForPost(post, section, 1+Math.floor(Math.random()*2));
    }
  }
}

// ─── Claude API 호출 ─────────────────────────────────────────
async function callClaudeForComment(post, commenter) {
  const dice = Math.random();
  const lengthHint = dice<0.5 ? '10자 이하 초단문' : dice<0.85 ? '1~2문장' : '3~5문장';
  const hasImage = post.hasImg || post.imgData;
  const imgNote = hasImage ? `\n게시물에 사진도 첨부됨 (이모지: ${post.imgEmoji||'사진'})` : '';

  const prompt = `너는 한국 SNS 사용자 "${commenter.name}"(타입: ${commenter.type}, 말투: ${commenter.tone})이야.
아래 게시물에 댓글을 달아.${imgNote}

게시물 작성자: ${post.name}
게시물 내용: ${post.text}

규칙:
- 절대 챗봇처럼 말하지 마 ("힘드셨겠네요" 같은 거 금지)
- 실제 한국 SNS 댓글처럼 자연스럽게
- 줄임말, ㅋㅋ, ㅠㅠ 같은 표현 자유롭게
- 길이: ${lengthHint}
- 댓글 텍스트만 출력 (설명 없이)`;

  return callClaude(prompt, 100);
}

async function callClaudeForReply(post, userComment, replier) {
  const prompt = `너는 한국 SNS 사용자 "${replier.name}"(타입: ${replier.type}, 말투: ${replier.tone})이야.
아래 댓글에 리플 달아.

게시물: ${post.text}
댓글: ${userComment.text}

규칙:
- 짧고 자연스럽게 (1~2문장, 대부분 한 줄)
- 실제 SNS 리플 느낌
- 댓글 텍스트만 출력`;

  return callClaude(prompt, 80);
}

// 새 포스트 생성 - 최근 글 컨텍스트와 다양성 강조
async function callClaudeForPost(acc, topic, recentTexts='', withImg=false) {
  const imgHint = withImg ? '\n사진을 첨부하는 포스트야. 사진 찍었다는 언급 포함해.' : '';
  // 타입별 상황 다양화
  const situations = {
    '일상': ['방금 일어남','퇴근함','밥 먹는 중','산책 중','멍 때리는 중','방 청소하다가','유튜브 보다가','잠 못 자고 있음'],
    '게임': ['방금 졌음','연승 중','캐릭터 키우는 중','버그 발견','신맵 나옴','팀원이 문제','업데이트 후 망함'],
    '음식': ['방금 먹음','먹으러 감','배달 시킴','직접 요리함','맛집 발견','실망한 음식','야식 고민 중'],
    '공부': ['도서관에서','카페에서','집에서','시험 앞두고','포기하고 싶음','집중 안 됨','드디어 이해됨'],
  };
  const situation = (situations[topic]||situations['일상'])[Math.floor(Math.random()*8)];

  const prompt = `너는 한국 SNS 사용자 "${acc.name}"(타입: ${acc.type}, 관심사: ${acc.interests.join(',')}, 말투: ${acc.tone})이야.
지금 상황: ${situation}
주제: ${topic}
${imgHint}

아래 최근 글들과 완전히 다른 내용으로 SNS 게시물을 써:
최근 글들: ${recentTexts.slice(0,200)||'없음'}

규칙:
- 실제 한국인이 SNS에 올리는 것처럼 (인스타, 트위터 느낌)
- 너무 완성도 높지 않아도 됨
- 1~4줄 (장문형 계정은 더 길게 가능)
- 게시물 텍스트만 출력 (설명 없이)
- 최근 글과 완전히 다른 내용으로`;

  return callClaude(prompt, 180);
}

// 사용자 게시물에 반응하는 AI (이미지 있으면 이미지 언급)
async function callClaudeForUserPostComment(post, commenter) {
  const hasImage = post.hasImg || post.imgData;
  const imgNote = hasImage ? '\n(사용자가 사진을 함께 올렸음. 사진 내용에 반응해도 됨)' : '';

  const prompt = `너는 한국 SNS 사용자 "${commenter.name}"(타입: ${commenter.type}, 말투: ${commenter.tone})이야.
사용자가 올린 게시물에 댓글 달아.${imgNote}

게시물: ${post.text}

규칙:
- 짧고 자연스럽게 (1~2문장)
- 실제 SNS 댓글처럼
- 사진 있으면 사진에도 반응 가능 ("사진 좋다", "어디임" 등)
- 댓글 텍스트만 출력`;

  return callClaude(prompt, 100);
}

async function callClaude(prompt, maxTokens=200) {
  try {
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        contents:[{ parts:[{ text: prompt }] }],
        generationConfig:{ maxOutputTokens: maxTokens, temperature: 1.0 }
      })
    });
    const data = await res.json();
    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    return text ? text.trim() : null;
  } catch(e) {
    console.error(e);
    return null;
  }
}

// ─── 사용자 게시물 작성 ──────────────────────────────────────
async function submitPost() {
  const input = document.getElementById('postInput');
  const text = input.value.trim();
  if(!text && !pendingImg) return;
  const imgData = pendingImg;
  input.value = '';
  removePendingImg();

  const post = {
    id: ++state.postIdCounter,
    accountId: 'user', name: state.user.name, handle: state.user.handle,
    emoji: state.user.name.slice(0,1), bg:'#ff4545',
    text: text||'📷', ts: Date.now(),
    likes: 0, liked: false, comments: [], commentsLoaded: true,
    isUser: true,
    hasImg: !!imgData, imgData: imgData||null, imgEmoji:null, imgBg:null,
  };
  state.posts.push(post);
  addPostToFeed(post);
  document.getElementById('statPosts').textContent = state.posts.filter(p=>p.isUser).length;
  showToast('게시됨 ✓');
  saveState();

  // AI들이 반응
  const respondCount = Math.floor(Math.random()*4)+2;
  const commenters = randomAccounts(respondCount, null);
  for(let i=0; i<commenters.length; i++) {
    setTimeout(async()=>{
      const acc = commenters[i];
      const t = await callClaudeForUserPostComment(post, acc);
      if(!t) return;
      const comment = {
        id: Date.now()+i, name: acc.name, handle: acc.handle, bg: acc.bg, emoji: acc.emoji,
        text: t, ts: Date.now(), likes: Math.floor(Math.random()*5),
      };
      post.comments.push(comment);
      if(Math.random()<0.5) post.likes++;
      updatePostEl(post);
      saveState();
      const section = document.getElementById('comments-'+post.id);
      if(section&&section.style.display!=='none') {
        const wrap = section.querySelector('.comments-section');
        if(wrap) wrap.appendChild(renderComment(comment));
      }
    }, (i+1)*(2000+Math.random()*4000));
  }
}

// ─── UI 유틸 ─────────────────────────────────────────────────
function showPage(page) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(t=>t.classList.remove('active'));
  document.getElementById(page+'Page').classList.add('active');
  const navTab = document.getElementById('tab-'+page);
  const bnavBtn = document.getElementById('bnav-'+page);
  if(navTab) navTab.classList.add('active');
  if(bnavBtn) bnavBtn.classList.add('active');
  if(page==='profile') renderMyProfile();
}

function renderMyProfile() {
  const myPosts = state.posts.filter(p=>p.isUser).reverse();
  const feed = document.getElementById('myFeed');
  feed.innerHTML = '';
  if(myPosts.length===0) {
    feed.innerHTML = '<div class="empty"><div class="empty-icon">🌑</div><div>아직 게시물이 없어요</div></div>';
    return;
  }
  myPosts.forEach(p=>{ feed.appendChild(renderPost(p)); });
  document.getElementById('statPosts').textContent = myPosts.length;
  document.getElementById('statLikes').textContent = myPosts.reduce((s,p)=>s+p.likes,0);
}

function focusComposer() {
  showPage('feed');
  document.getElementById('postInput').focus();
}

function sharePost(id) { showToast('링크가 복사됐어요'); }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2500);
}

document.addEventListener('keydown', e => {
  if(e.key==='Enter' && e.ctrlKey && document.getElementById('postInput')===document.activeElement) {
    submitPost();
  }
});
